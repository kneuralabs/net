name: LinkedIn Followers

# Refresh of the LinkedIn follower count every 6 hours. The fetch script reads
# the public company page and writes assets/linkedin.json; this workflow then
# publishes that file to the UNPROTECTED `feeds-data` branch (never main), which
# the live LinkedIn widget reads cross-origin from raw.githubusercontent.com.
# A side branch sidesteps main's branch protection; a failed publish fails the
# run (no silent green) so staleness is visible.
on:
  schedule:
    - cron: "35 */6 * * *"   # every 6 hours at :35 (00:35/06:35/12:35/18:35 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Shared with governance-brief so the two feed jobs serialise their pushes
  # to feeds-data (never race a fast-forward). false => queue, don't cancel.
  group: feeds-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate fetch script
        run: python3 -m py_compile scripts/fetch_linkedin_followers.py

      - name: Fetch follower count
        run: python3 scripts/fetch_linkedin_followers.py

      - name: Publish refreshed follower count to the feeds-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish_to_feeds_data.sh assets/linkedin.json "chore: refresh LinkedIn follower count"
