name: LinkedIn Followers

# Best-effort refresh of the committed follower-count seed (assets/linkedin.json)
# on main. The live LinkedIn widget fetches the public company page directly in
# the browser on each load and uses this committed file only as a last-known-good
# fallback. If the push is gated by branch protection the job still succeeds.
on:
  schedule:
    - cron: "35 */6 * * *"   # every 6 hours at :35 (00:35/06:35/12:35/18:35 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: linkedin-followers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate fetch script
        run: python3 -m py_compile scripts/fetch_linkedin_followers.py

      - name: Fetch follower count
        run: python3 scripts/fetch_linkedin_followers.py

      - name: Commit refreshed seed to main if changed (best-effort)
        run: |
          git add assets/linkedin.json
          if git diff --cached --quiet; then
            echo "No change to assets/linkedin.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh LinkedIn follower count seed"
          # Pushing to main also redeploys Pages. If branch protection blocks the
          # bot, don't fail the run — the widget stays current client-side.
          git push origin HEAD:main || echo "::warning::push to main blocked; widget stays current via in-browser fetch"
