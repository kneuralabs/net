name: LinkedIn Followers

# Pulls the Kneuralabs LinkedIn company-page follower count every six hours
# and commits it to assets/linkedin.json, which the intranet LinkedIn widget
# reads at page load. Each push to main also redeploys GitHub Pages, so the
# live site reflects increases and decreases automatically.
on:
  schedule:
    - cron: "35 */6 * * *"   # every 6 hours at :35 (00:35/06:35/12:35/18:35 UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: linkedin-followers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate fetch script
        run: python3 -m py_compile scripts/fetch_linkedin_followers.py

      - name: Fetch follower count
        run: python3 scripts/fetch_linkedin_followers.py

      - name: Commit via auto-merged PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- assets/linkedin.json; then
            echo "No change to assets/linkedin.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="bot/linkedin-followers-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git add assets/linkedin.json
          git commit -m "chore: refresh LinkedIn follower count"
          git push origin "$BRANCH"
          # main is protected (PR-only); open and immediately merge a PR so the
          # refreshed count reaches main and redeploys Pages.
          gh pr create --base main --head "$BRANCH" \
            --title "chore: refresh LinkedIn follower count" \
            --body "Automated refresh of assets/linkedin.json."
          # Merge now; if required checks gate the branch, fall back to
          # auto-merge so it lands once they pass.
          gh pr merge "$BRANCH" --merge --delete-branch \
            || gh pr merge "$BRANCH" --merge --auto --delete-branch
