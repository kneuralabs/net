name: Update LinkedIn Follower Count

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:          # allow manual trigger

permissions:
  contents: write

jobs:
  fetch-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npx --yes playwright install chromium --with-deps 2>&1 | tail -5

      - name: Fetch LinkedIn follower count via Playwright
        id: fetch
        run: |
          COUNT=$(node - << 'JSEOF'
          const { chromium } = require('playwright');

          const PATTERNS = [
            /"followerCount"\s*:\s*(\d+)/,
            /"followersCount"\s*:\s*(\d+)/,
            /"numberOfFollowers"\s*:\s*(\d+)/,
            /"numFollowers"\s*:\s*(\d+)/,
            /(\d[\d,]+)\s+followers/i,
          ];

          function extractCount(text) {
            for (const p of PATTERNS) {
              const m = text.match(p);
              if (m) {
                const n = parseInt(m[1].replace(/,/g, ''), 10);
                if (!isNaN(n) && n > 10 && n < 1e8) return n;
              }
            }
            return null;
          }

          (async () => {
            const browser = await chromium.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox',
                     '--disable-blink-features=AutomationControlled'],
            });
            const ctx = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              locale: 'en-US',
              timezoneId: 'America/New_York',
              viewport: { width: 1280, height: 800 },
              extraHTTPHeaders: {
                'Accept-Language': 'en-US,en;q=0.9',
                'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              },
            });

            // Mask headless fingerprints
            await ctx.addInitScript(() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
              Object.defineProperty(navigator, 'plugins', { get: () => [1, 2, 3] });
              window.chrome = { runtime: {} };
            });

            const page = await ctx.newPage();

            for (const url of [
              'https://www.linkedin.com/company/kneuralabs/',
              'https://www.linkedin.com/company/kneuralabs/about/',
            ]) {
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.waitForTimeout(2500);
                const html = await page.content();
                const n = extractCount(html);
                if (n) { process.stdout.write(String(n)); break; }
              } catch (_) {}
            }

            await browser.close();
          })();
          JSEOF
          )

          # Fallback: curl with realistic headers if Playwright found nothing
          if [ -z "$COUNT" ]; then
            extract_count() {
              echo "$1" | grep -oP '"followerCount"\s*:\s*\K[0-9]+|[0-9,]+ followers' \
                | head -1 | tr -d ',' | grep -oP '[0-9]+'
            }
            for URL in \
              "https://www.linkedin.com/company/kneuralabs/" \
              "https://www.linkedin.com/company/kneuralabs/about/"; do
              HTML=$(curl -sL --max-time 20 \
                -b /tmp/li_cookies.txt -c /tmp/li_cookies.txt \
                -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
                -H "Accept-Language: en-US,en;q=0.9" \
                -H "Accept-Encoding: gzip, deflate, br" \
                -H "Sec-Fetch-Dest: document" -H "Sec-Fetch-Mode: navigate" \
                --compressed "$URL" 2>/dev/null) || continue
              MATCH=$(extract_count "$HTML")
              if [ -n "$MATCH" ] && [ "$MATCH" -gt 10 ] 2>/dev/null; then COUNT="$MATCH"; break; fi
            done
          fi

          if [ -z "$COUNT" ] || [ "$COUNT" -le 10 ] 2>/dev/null; then
            echo "Could not parse follower count — keeping existing value"
            echo "count=" >> "$GITHUB_OUTPUT"
          else
            echo "Fetched count: $COUNT"
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Write linkedin.json
        if: steps.fetch.outputs.count != ''
        run: |
          COUNT="${{ steps.fetch.outputs.count }}"
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{"count":%s,"ts":"%s"}\n' "$COUNT" "$TS" > assets/linkedin.json
          echo "Wrote assets/linkedin.json: count=$COUNT ts=$TS"

      - name: Commit if changed
        if: steps.fetch.outputs.count != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/linkedin.json
          if git diff --cached --quiet; then
            echo "No change in follower count — nothing to commit"
          else
            git commit -m "chore: update LinkedIn follower count to ${{ steps.fetch.outputs.count }}"
            git push origin main
          fi
