name: Update LinkedIn Follower Count

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:          # allow manual trigger

permissions:
  contents: write

jobs:
  fetch-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch LinkedIn follower count
        id: fetch
        run: |
          COUNT=""

          extract_count() {
            local HTML="$1"
            for PATTERN in \
              '"followerCount":[[:space:]]*([0-9]+)' \
              '"followersCount":[[:space:]]*([0-9]+)' \
              '"numberOfFollowers":[[:space:]]*([0-9]+)' \
              '"numFollowers":[[:space:]]*([0-9]+)' \
              '"followerCount":"([0-9]+)"' \
              'followers_count[^0-9]*([0-9]+)'; do
              MATCH=$(echo "$HTML" | grep -oP "${PATTERN}" | head -1 | grep -oP '[0-9]+$')
              if [ -n "$MATCH" ] && [ "$MATCH" -gt 10 ] 2>/dev/null; then
                echo "$MATCH"; return
              fi
            done
            # Plain-text "215 followers"
            MATCH=$(echo "$HTML" | grep -oP '[0-9,]+ followers' | head -1 | tr -d ',' | grep -oP '^[0-9]+')
            if [ -n "$MATCH" ] && [ "$MATCH" -gt 10 ] 2>/dev/null; then
              echo "$MATCH"; return
            fi
          }

          # Attempt 1: direct page fetch with full browser headers + cookie jar
          for URL in \
            "https://www.linkedin.com/company/kneuralabs/" \
            "https://www.linkedin.com/company/kneuralabs/about/"; do
            HTML=$(curl -sL --max-time 20 \
              -b /tmp/li_cookies.txt -c /tmp/li_cookies.txt \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
              -H "Accept-Language: en-US,en;q=0.9" \
              -H "Accept-Encoding: gzip, deflate, br" \
              -H "Sec-Fetch-Dest: document" \
              -H "Sec-Fetch-Mode: navigate" \
              -H "Sec-Fetch-Site: none" \
              -H "Cache-Control: max-age=0" \
              --compressed \
              "$URL" 2>/dev/null) || continue
            MATCH=$(extract_count "$HTML")
            if [ -n "$MATCH" ]; then COUNT="$MATCH"; break; fi
          done

          # Attempt 2: CORS proxy services
          if [ -z "$COUNT" ]; then
            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('https://www.linkedin.com/company/kneuralabs/'))")
            for PROXY in \
              "https://api.allorigins.win/get?url=${ENCODED}" \
              "https://corsproxy.io/?${ENCODED}"; do
              RESP=$(curl -sL --max-time 15 "$PROXY" 2>/dev/null) || continue
              # allorigins wraps in {"contents":"..."}
              INNER=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('contents',''))" 2>/dev/null || echo "$RESP")
              MATCH=$(extract_count "$INNER")
              if [ -n "$MATCH" ]; then COUNT="$MATCH"; break; fi
            done
          fi

          # Attempt 3: LinkedIn public API (no auth required for basic company info)
          if [ -z "$COUNT" ]; then
            RESP=$(curl -sL --max-time 15 \
              -H "User-Agent: Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" \
              "https://www.linkedin.com/company/kneuralabs/" 2>/dev/null)
            MATCH=$(extract_count "$RESP")
            if [ -n "$MATCH" ]; then COUNT="$MATCH"; fi
          fi

          if [ -z "$COUNT" ]; then
            echo "Could not parse follower count — keeping existing value"
            echo "count=" >> "$GITHUB_OUTPUT"
          else
            echo "Fetched count: $COUNT"
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Write linkedin.json
        if: steps.fetch.outputs.count != ''
        run: |
          COUNT="${{ steps.fetch.outputs.count }}"
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"count\":$COUNT,\"ts\":\"$TS\"}" > assets/linkedin.json
          echo "Wrote assets/linkedin.json: count=$COUNT ts=$TS"

      - name: Commit if changed
        if: steps.fetch.outputs.count != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/linkedin.json
          if git diff --cached --quiet; then
            echo "No change in follower count — nothing to commit"
          else
            git commit -m "chore: update LinkedIn follower count to ${{ steps.fetch.outputs.count }}"
            git push origin main
          fi
