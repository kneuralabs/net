name: Daily Governance Brief

# Pulls authentic AI-governance headlines once a day and commits them to
# assets/news.json, which the intranet Brief reads at page load.
on:
  schedule:
    - cron: "20 6 * * *"   # 06:20 UTC daily (~11:50 IST)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: governance-brief
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate fetch script
        run: python3 -m py_compile scripts/fetch_governance_news.py

      - name: Fetch authentic governance news
        run: python3 scripts/fetch_governance_news.py

      - name: Commit via auto-merged PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- assets/news.json; then
            echo "No change to assets/news.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="bot/governance-brief-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git add assets/news.json
          git commit -m "chore: refresh Daily Governance Brief"
          git push origin "$BRANCH"
          # main is protected (PR-only); open and immediately merge a PR so the
          # refreshed feed reaches main and redeploys Pages.
          gh pr create --base main --head "$BRANCH" \
            --title "chore: refresh Daily Governance Brief" \
            --body "Automated daily refresh of assets/news.json."
          # Merge now; if required checks gate the branch, fall back to
          # auto-merge so it lands once they pass.
          gh pr merge "$BRANCH" --merge --delete-branch \
            || gh pr merge "$BRANCH" --merge --auto --delete-branch
