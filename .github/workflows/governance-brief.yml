name: Daily Governance Brief

# Best-effort daily refresh of the committed Brief seed (assets/news.json) on
# main. The live intranet Brief no longer depends on this: it fetches worldwide
# headlines client-side on every page load and uses this committed file only as
# an instant-paint seed / offline fallback. If the push is gated by branch
# protection the job still succeeds — freshness is guaranteed in-browser.
on:
  schedule:
    - cron: "20 6 * * *"   # 06:20 UTC daily (~11:50 IST)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: governance-brief
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate fetch script
        run: python3 -m py_compile scripts/fetch_governance_news.py

      - name: Fetch authentic governance news
        run: python3 scripts/fetch_governance_news.py

      - name: Commit refreshed seed to main if changed (best-effort)
        run: |
          git add assets/news.json
          if git diff --cached --quiet; then
            echo "No change to assets/news.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Daily Governance Brief seed"
          # Pushing to main also redeploys Pages. If branch protection blocks the
          # bot, don't fail the run — the live Brief stays current client-side.
          git push origin HEAD:main || echo "::warning::push to main blocked; live Brief stays current via in-browser fetch"
