name: Daily Governance Brief

# Pulls authentic AI-governance headlines once a day and publishes them to the
# unprotected `feeds-data` branch, which the intranet Brief reads live via
# raw.githubusercontent (main is protected, so CI cannot push to it).
on:
  schedule:
    - cron: "20 6 * * *"   # 06:20 UTC daily (~11:50 IST)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: governance-brief
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Default GITHUB_TOKEN — it can push to non-protected branches like feeds-data.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate fetch script
        run: python3 -m py_compile scripts/fetch_governance_news.py

      - name: Fetch authentic governance news
        run: python3 scripts/fetch_governance_news.py

      - name: Publish to feeds-data branch if changed
        run: |
          git add assets/news.json
          if git diff --cached --quiet; then
            echo "No change to assets/news.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Daily Governance Brief"
          # main is protected; publish to the unprotected feeds-data branch the
          # site reads live via raw.githubusercontent (no Pages redeploy needed).
          git push -f origin HEAD:feeds-data
