  <style>/* ============================================================
   KNEURALABS Intranet — "Archive" edition

:root {

     7 core colours · max 3 per page · status colours = status only */
  --c-cyan:        #00F0FF;   /* accent only — CTAs, rules, labels */
  --c-near-black:  #0A141F;   /* table headers, dark UI */
  --c-deep-navy:   #204376;   /* H2, structural borders */
  --c-charcoal:    #141414;   /* H1, display, body */
  --c-cyan-dim:    #00B8C9;   /* hover, secondary borders */
  --c-cyan-ghost:  #D6FBFF;   /* callouts */
  --c-steel:       #5C6F88;   /* captions, metadata — AA-compliant on white */
  --c-smoke:       #EEF1F5;   /* alt rows, secondary bg */
  --c-emerald:     #00B871;   /* status: compliant */
  --c-alert-red:   #E53E3E;   /* status: non-compliant */
  --c-amber:       #F6A623;   /* status: pending */

  /* Mapped tokens (Brand default) */
  --paper:     #FFFFFF;
  --paper-2:   var(--c-smoke);
  --ink:       var(--c-charcoal);
  --ink-2:     var(--c-near-black);
  --muted:     var(--c-steel);
  --rule:      rgba(32, 67, 118, 0.18);   /* navy at low opacity */
  --rule-2:    rgba(32, 67, 118, 0.10);
  --accent:    var(--c-cyan);              /* cyan — lines & labels only */
  --accent-ink:var(--c-deep-navy);         /* navy — inline text emphasis */
  --signal:    var(--c-emerald);
  --warn:      var(--c-alert-red);

  /* Surface used for dark "elevated" UI (Open Tasks card, aside poster).
     Keeps contrast against page bg in both light and dark themes. */
  --surface-elevated:     var(--c-near-black);
  --surface-elevated-ink: #FFFFFF;
  --surface-elevated-rule: rgba(255, 255, 255, 0.14);

  /* Typography */
  --f-display: "Inter", ui-sans-serif, system-ui, sans-serif;
  --f-ui: "Inter", ui-sans-serif, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* Density */
  --pad-card: 22px;
  --pad-section: 56px;
  --gap-grid: 16px;
  --tile-h: 196px;

  --t-fast: 140ms;
  --t-med: 320ms;
  --t-slow: 720ms;
  --ease: cubic-bezier(.2,.7,.2,1);
}

/* Theme variants — all brand-compliant. Default is the white "Brand" mode. */
html[data-theme="authority"] {

}
html[data-theme="navy"] {
  --paper:     var(--c-deep-navy);

  --accent:    var(--c-cyan);

/* ============================================================
   Base
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "ss01", "cv11";
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

::selection { background: var(--accent); color: var(--paper); }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }

.mono { font-family: var(--f-mono); font-feature-settings: "ss01","ss02"; }
.serif { font-family: var(--f-display); }
.smallcaps {

/* ============================================================
   Status strip — clocks + weather + holiday
   ============================================================ */
.strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);

  border-top: 1px solid #cc0000;
}
.strip__cell {
  background: var(--paper);

  align-items: baseline;

  display: flex;
  align-items: baseline;
  gap: 8px;
}
.strip__big small {
  font-size: 13px;

}

  font-family: var(--f-mono);
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 0.04em;

}

}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

  .strip { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
  .strip__big { font-size: 22px; }
}

/* ============================================================
   Welcome card — editorial pull quote
   ============================================================ */
.welcome {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 48px;
  padding: var(--pad-section) 0 calc(var(--pad-section) * 0.6);
  border-bottom: 1px solid var(--rule);

  align-items: center;
  gap: 12px;
}

  border-radius: 6px;
  display: block;
  flex-shrink: 0;
  object-fit: cover;
  border: 1px solid var(--rule);
}
.welcome__sig-text {
  display: flex; flex-direction: column;
  gap: 2px;

  color: var(--ink);

}
.welcome__sig-name { font-weight: 500; }
.welcome__sig-text small {

/* ============================================================

   ============================================================ */
.opentasks {

  letter-spacing: -0.03em;

  margin-bottom: 28px;
}
.section__num {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--muted);
  text-transform: uppercase;
}
.section__title {
  font-family: var(--f-display);
  font-size: clamp(28px, 3vw, 42px);
  line-height: 1;
  letter-spacing: -0.028em;
  margin: 0;
  font-weight: 600;
}
.section__title em { color: var(--accent-ink); font-style: normal; font-weight: 600; }
.section__meta {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ============================================================
   Tools grid
   ============================================================ */
.tools {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap-grid);
}
@media (max-width: 1100px) { .tools { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 780px)  { .tools { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px)  { .tools { grid-template-columns: repeat(2, 1fr); } }

/* ── KN Brand colour tokens ──────────────────────────────── */
:root {
  --kn-royal:   #1C5CAA;
  --kn-navy:    #0D2E5A;
  --kn-red:     #C8281E;
  --kn-sky:     #4A8BC8;
  --kn-silver:  #D0D2D6;
  --kn-canvas:  #F7F8FA;
  --kn-frost:   #E0E4EA;
  --kn-charcoal:#1A1D23;
  --kn-slate:   #6B7280;
  --kn-crimson: #8B1A12;
}

/* tile — bordered (default) */
.tile {
  position: relative;
  background: rgba(247,248,250,0.55);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border: 1px solid rgba(28,92,170,0.18);
  box-shadow: 0 2px 18px rgba(13,46,90,0.08), inset 0 1px 0 rgba(255,255,255,0.7);
  min-height: var(--tile-h);
  padding: var(--pad-card);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: default;
  overflow: hidden;
  transition: transform var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              background var(--t-fast) var(--ease);
  isolation: isolate;
}
.tile:hover {
  border-color: rgba(28,92,170,0.48);
  background: rgba(247,248,250,0.72);
  box-shadow: 0 6px 28px rgba(13,46,90,0.14), inset 0 1px 0 rgba(255,255,255,0.85);
  transform: translateY(-2px);
}
.tile--locked:hover { transform: translateY(-2px); border-color: var(--kn-royal,#1C5CAA); }

.tile__top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.tile__idx {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.tile__state {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--signal);
  display: flex; align-items: center; gap: 6px;
}
.tile__icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 26px; line-height: 1;
  border: 1px solid transparent;
  flex-shrink: 0;
  transition: transform 0.2s ease;
}
.tile:hover .tile__icon { transform: scale(1.08) rotate(-2deg); }
.tile__state--locked { color: var(--c-amber); }
.tile__state::before {
  content: "";
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.tile__body { display: flex; flex-direction: column; gap: 4px; margin-top: auto; }
.tile__cat {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.tile__name {
  font-family: var(--f-display);
  font-size: 26px;
  line-height: 1.05;
  letter-spacing: -0.025em;
  color: var(--ink);
  font-weight: 600;
  font-style: normal;
}
.tile__name sup {
  font-family: var(--f-mono);
  font-size: 10px;
  vertical-align: super;
  font-style: normal;
  color: var(--muted);
  letter-spacing: 0.04em;
  margin-left: 2px;
}
.tile__desc {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 4px;
  line-height: 1.45;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* tile style variants */
html[data-tile="filled"] .tile {
  background: rgba(28,92,170,0.08);
  border-color: rgba(28,92,170,0.14);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
}
html[data-tile="filled"] .tile:hover {
  background: rgba(13,46,90,0.82);
  color: #F7F8FA;
  border-color: rgba(13,46,90,0.9);
}
html[data-tile="filled"] .tile:hover .tile__name,
html[data-tile="filled"] .tile:hover .tile__desc,
html[data-tile="filled"] .tile:hover .tile__cat,
html[data-tile="filled"] .tile:hover .tile__idx {
  color: var(--paper);
}

html[data-tile="list"] .tools {
  grid-template-columns: 1fr;
  gap: 0;
}
html[data-tile="list"] .tile {
  min-height: 0;
  flex-direction: row;
  align-items: center;
  gap: 24px;
  padding: 18px 20px;
  border: 0;
  border-bottom: 1px solid var(--rule);
}
html[data-tile="list"] .tile__top { flex: 0 0 56px; align-items: center; }
html[data-tile="list"] .tile__body { flex: 1; flex-direction: row; align-items: baseline; gap: 16px; margin: 0; }
html[data-tile="list"] .tile__name { font-size: 22px; }
html[data-tile="list"] .tile__desc { display: none; }

/* (icon seal variants removed — icons permanently off) */

/* motion off */
html[data-motion="off"] *,
html[data-motion="off"] *::before,
html[data-motion="off"] *::after {
  transition: none !important;
  animation: none !important;
}
html[data-motion="playful"] .tile:hover {
  transform: translateY(-4px) rotate(-0.4deg);
}

/* tile entrance animation */
.tile {
  animation: tile-in 540ms var(--ease) both;
}
@keyframes tile-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   Lock modal
   ============================================================ */
.lock-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 17, 13, 0.42);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  z-index: 200;
  animation: fade-in 200ms var(--ease);
}
@keyframes fade-in {
  from { opacity: 0; } to { opacity: 1; }
}
.lock-modal {
  width: min(440px, calc(100vw - 32px));
  background: var(--paper);
  border: 1px solid var(--ink);
  padding: 28px 28px 22px;
  position: relative;
  animation: modal-in 320ms var(--ease);
}
@keyframes modal-in {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.lock-modal.shake { animation: shake 360ms var(--ease); }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
.lock-modal__head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 20px;
}
.lock-modal__num {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.lock-modal__title {
  font-family: var(--f-display);
  font-size: 32px;
  line-height: 1.05;
  margin: 0 0 4px;
  font-style: normal;
  letter-spacing: -0.025em;
  font-weight: 600;
}
.lock-modal__title sup {
  font-family: var(--f-mono);
  font-size: 10px;
  font-style: normal;
  color: var(--muted);
  vertical-align: super;
}
.lock-modal__cat {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.lock-modal__prompt {
  font-size: 13px;
  color: var(--ink-2);
  margin: 18px 0 8px;
}
.lock-input {
  width: 100%;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--ink);
  padding: 10px 0 12px;
  font-family: var(--f-mono);
  font-size: 18px;
  letter-spacing: 0.06em;
  color: var(--ink);
  outline: none;
  caret-color: var(--accent-ink);
}
.lock-input::placeholder { color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; font-size: 13px; }

.lock-status {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  height: 16px;
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.lock-status--err { color: var(--warn); }
.lock-status--ok { color: var(--signal); }
.lock-status .spinner {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  border: 1px solid currentColor;
  border-top-color: transparent;
  animation: spin 700ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.lock-actions {
  margin-top: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.lock-hint {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.lock-hint b { color: var(--accent-ink); font-family: var(--f-mono); }
.sso-overlay {
  position: fixed; inset: 0;
  background: rgba(20,17,13,.55);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: grid; place-items: center;
  z-index: 200; animation: fade-in 200ms var(--ease);
}
.sso-modal {
  width: min(480px, calc(100vw - 32px));
  background: var(--paper); border: 1px solid var(--ink);
  display: flex; flex-direction: column;
  animation: modal-in 320ms var(--ease); overflow: hidden;
}
.sso-modal__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--ink);
}
.sso-modal__title {
  font-family: var(--f-mono); font-size: 12px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
}
.sso-modal__close {
  background: none; border: none; cursor: pointer;
  color: var(--ink); font-size: 14px; padding: 2px 6px;
  opacity: .6; line-height: 1;
}
.sso-modal__close:hover { opacity: 1; }
.sso-modal__frame { width: 100%; height: 520px; border: none; display: block; }
.btn {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 10px 16px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
  cursor: default;
}
.btn:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: var(--paper); }
.btn--ghost { background: transparent; color: var(--ink); }
.btn--ghost:hover { background: var(--ink); color: var(--paper); }

/* ============================================================
   News feed — editorial column
   ============================================================ */
.feed {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 48px;
  align-items: start;
}
@media (max-width: 860px) {
  .feed { grid-template-columns: 1fr; gap: 24px; }
}
.feed__list {
  display: flex;
  flex-direction: column;
  background: rgba(247,248,250,0.30);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(28,92,170,0.10);
  border-radius: 2px;
  overflow: hidden;
}
.feed__item {
  display: grid;
  grid-template-columns: 92px 1fr auto;
  gap: 24px;
  padding: 20px 12px;
  border-top: 1px solid rgba(28,92,170,0.14);
  align-items: center;
  cursor: default;
  text-decoration: none;
  color: inherit;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
  background: rgba(247,248,250,0.42);
  backdrop-filter: blur(10px) saturate(1.3);
  -webkit-backdrop-filter: blur(10px) saturate(1.3);
}
.feed__item:hover {
  background: rgba(28,92,170,0.08);
  margin: 0 -4px;
  padding-left: 16px;
  padding-right: 16px;
  border-top-color: rgba(28,92,170,0.30);
}
.feed__item:hover .feed__title { color: var(--kn-royal,#1C5CAA); }
.feed__item:hover .feed__arrow { transform: translate(2px, -2px); color: var(--kn-royal,#1C5CAA); }
.feed__item:last-child { border-bottom: 1px solid rgba(28,92,170,0.14); }
.feed__arrow {
  display: inline-block;
  margin-left: 6px;
  color: var(--muted);
  transition: transform var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.feed__title { transition: color var(--t-fast) var(--ease); }
.feed__date {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  text-transform: uppercase;
}
.feed__title {
  font-family: var(--f-display);
  font-size: 19px;
  line-height: 1.3;
  margin: 0 0 4px;
  font-weight: 500;
  letter-spacing: -0.015em;
  text-wrap: pretty;
}
.feed__src {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.feed__src b { color: var(--kn-royal,#1C5CAA); font-family: var(--f-mono); font-weight: 500; }
.feed__chip {
  font-family: var(--f-mono);
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--kn-royal,#1C5CAA);
  border: 1px solid rgba(28,92,170,0.30);
  background: rgba(28,92,170,0.06);
  padding: 3px 8px;
  white-space: nowrap;
  align-self: start;
}
@media (max-width: 720px) {
  .feed__item { grid-template-columns: 1fr; gap: 6px; padding: 14px 12px; }
  .feed__title { font-size: 16px; }
  .feed__date  { font-size: 10px; }
  .feed__src   { font-size: 9.5px; }
  .feed__chip { display: none; }
}

/* Aside */
.aside {
  position: sticky;
  top: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.aside__poster {
  background: rgba(13,46,90,0.72);
  backdrop-filter: blur(18px) saturate(1.6);
  -webkit-backdrop-filter: blur(18px) saturate(1.6);
  border: 1px solid rgba(74,139,200,0.30);
  box-shadow: 0 4px 32px rgba(13,46,90,0.22), inset 0 1px 0 rgba(74,139,200,0.20);
  color: #FFFFFF;
  padding: 22px;
  position: relative;
  overflow: hidden;
  aspect-ratio: 4 / 5;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
/* orb glows are rendered as JSX divs in FeedSection for weekly colour rotation */
.aside__poster h3 {
  font-family: var(--f-display);
  font-size: 36px;
  line-height: 1.04;
  margin: 0;
  position: relative;
  font-style: normal;
  letter-spacing: -0.025em;
  font-weight: 600;
  color: #FFFFFF;
}
.aside__poster .smallcaps { color: rgba(255,255,255,0.65); position: relative; }
.aside__poster .poster-stamp {
  position: relative;
  align-self: flex-end;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  border: 1px solid rgba(74,139,200,0.55);
  background: rgba(28,92,170,0.25);
  padding: 6px 10px;
  color: rgba(255,255,255,0.90);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

/* LinkedIn widget — company page follower count */
.li-card {
  background: var(--paper);
  border: 1px solid rgba(10,102,194,0.32);
  border-top: 2px solid #0A66C2;
  box-shadow: 0 2px 18px rgba(10,102,194,0.10), inset 0 1px 0 rgba(255,255,255,0.45);
  padding: 16px 18px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.li-card__lbl {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.li-card__row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.li-card__logo {
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;

  background: rgba(10,102,194,0.08);
  border: 1px solid rgba(10,102,194,0.32);

.li-card__logo:hover {

.li-card__count {

.li-card__sub {

  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 0.04em;

}

/* ============================================================
   Apple-grade feed & aside animations
   ============================================================ */

/* Feed list — elegant fade + scale entrance */
@keyframes feed-list-in {
  0%   { opacity: 0; transform: scale(0.985) translateY(8px); filter: blur(4px); }
  100% { opacity: 1; transform: scale(1)     translateY(0);   filter: blur(0); }
}
.feed__list {
  animation: feed-list-in 600ms cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: 60ms;
}

/* Feed items — staggered unfold: rows reveal from scaleY(0) so overflow:hidden
   never clips them (scale shrinks in place, no translateY overflow needed) */
@keyframes feed-item-unfold {
  0%   { opacity: 0; transform: scaleY(0.4)  translateZ(0); clip-path: inset(0 0 60% 0); }
  50%  { opacity: 1; }
  80%  { transform: scaleY(1.02) translateZ(0); clip-path: inset(0 0 0 0); }
  100% { transform: scaleY(1)    translateZ(0); clip-path: inset(0 0 0 0); }
}
.feed__item {
  animation: feed-item-unfold 480ms cubic-bezier(0.34, 1.4, 0.64, 1) both;
  transform-origin: top center;
  will-change: transform, opacity;
}
.feed__item:nth-child(1) { animation-delay: 120ms; }
.feed__item:nth-child(2) { animation-delay: 210ms; }
.feed__item:nth-child(3) { animation-delay: 300ms; }
.feed__item:nth-child(4) { animation-delay: 390ms; }
.feed__item:nth-child(5) { animation-delay: 480ms; }
.feed__item:nth-child(6) { animation-delay: 570ms; }

/* Feed item hover — spring margin/padding */
.feed__item {
  transition: background var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              margin 220ms cubic-bezier(0.34, 1.4, 0.64, 1),
              padding 220ms cubic-bezier(0.34, 1.4, 0.64, 1);
}

/* Feed arrow — smooth spring on hover */
.feed__arrow {
  transition: transform 260ms cubic-bezier(0.34, 1.5, 0.64, 1),
              color var(--t-fast) var(--ease);
}

/* Aside poster — deep bloom: scale up from a dark blur, saturate into full colour */
@keyframes poster-bloom {
  0%   { opacity: 0; transform: scale(0.92) translateY(24px); filter: blur(12px) saturate(0); }
  50%  { opacity: 1; filter: blur(2px) saturate(0.7); }
  100% { opacity: 1; transform: scale(1)    translateY(0);    filter: blur(0)    saturate(1); }
}
.aside__poster {
  animation: poster-bloom 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: 280ms;
  transition: box-shadow 400ms ease, border-color 400ms ease;
}
.aside__poster:hover {
  box-shadow: 0 8px 48px rgba(13,46,90,0.36), 0 0 0 1px rgba(74,139,200,0.40),
              inset 0 1px 0 rgba(74,139,200,0.28);
}

/* Orb 1 — gentle drift top-right */
@keyframes orb-drift-1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%       { transform: translate(-4%, 3%) scale(1.05); }
  66%       { transform: translate(3%, -4%) scale(0.96); }
}
/* Orb 2 — counter-drift bottom-left */
@keyframes orb-drift-2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%       { transform: translate(5%, -3%) scale(0.95); }
  66%       { transform: translate(-3%, 5%) scale(1.04); }
}

      }

      /* Sparse graph — connect nodes within ~28% of min(W,H) */
      const maxD = Math.min(W, H) * 0.30;
      for(let i = 0; i < nodes.length; i++){
        for(let j = i+1; j < nodes.length; j++){
          const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
          if(dx*dx + dy*dy < maxD*maxD) edges.push([i, j]);
        }
      }

      /* Guarantee every node has at least one connection */
      for(let i = 0; i < nodes.length; i++){
        if(edges.some(([a,b]) => a===i || b===i)) continue;
        let bestJ = -1, bestD = Infinity;
        for(let j = 0; j < nodes.length; j++){
          if(j===i) continue;
          const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
          const d=dx*dx+dy*dy;
          if(d<bestD){ bestD=d; bestJ=j; }
        }
        if(bestJ>=0) edges.push([i, bestJ]);
      }
    }

    function resize(){
      W = cv.width  = window.innerWidth;
      H = cv.height = window.innerHeight;
      buildGraph();
    }
    resize();
    window.addEventListener('resize', resize);

    /* ── Fire a node: launch pulses along its axons ── */
    function fireNode(idx){
      const n = nodes[idx];
      if(!n || n.refract > 0) return;
      n.glow    = 1;
      n.refract = 200 + Math.floor(Math.random() * 160); /* ~3-4 s refractory */
      const ne = edges.filter(([a,b]) => a===idx || b===idx);
      for(const [a,b] of ne){
        if(Math.random() < 0.55){
          const target = a===idx ? b : a;
          const speed  = 0.005 + Math.random() * 0.007;
          pulses.push({ from: idx, to: target, t: 0, speed });
        }
      }
    }

    function draw(){
      ctx.clearRect(0, 0, W, H);
      const p = pal();

      /* ── RESTING EDGES ── thin axon/dendrite lines */
      for(const [i,j] of edges){
        const a=nodes[i], b=nodes[j];
        const lit = a.glow > 0.05 || b.glow > 0.05;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = lit ? `${p.edgeRest}0.14)` : `${p.edgeRest}0.06)`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }

      /* ── PULSES ── electrochemical signal travelling along axon */
      for(let k = pulses.length-1; k >= 0; k--){
        const pl = pulses[k];
        pl.t += pl.speed;

        if(pl.t >= 1){
          pulses.splice(k, 1);
          /* cascade: target may fire after a brief synaptic delay */
          const tgt = nodes[pl.to];
          if(tgt && tgt.refract <= 0 && Math.random() < 0.50){
            tgt.pendingFire = 18 + Math.floor(Math.random() * 22); /* ~0.3 s delay */
          }
          continue;
        }

        const a=nodes[pl.from], b=nodes[pl.to];
        const px = a.x + (b.x-a.x)*pl.t;
        const py = a.y + (b.y-a.y)*pl.t;
        const alpha = Math.sin(pl.t * Math.PI); /* arc: 0→1→0 */

        /* Lit axon segment behind the pulse */
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `${p.edgeActive}${alpha * 0.28})`;
        ctx.lineWidth = 0.9;
        ctx.stroke();

        /* Short soft tail */
        const tailT = Math.max(0, pl.t - 0.18);
        const tx = a.x + (b.x-a.x)*tailT, ty = a.y + (b.y-a.y)*tailT;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(tx, ty);
        ctx.strokeStyle = `${p.pulseTail}${alpha * 0.55})`;
        ctx.lineWidth = 1.4;
        ctx.stroke();

        /* Pulse head — small soft glow, not a firework */
        const sg = ctx.createRadialGradient(px, py, 0, px, py, 5);
        sg.addColorStop(0, `${p.pulseHead}${alpha * 0.90})`);
        sg.addColorStop(1, `${p.pulseHead}0)`);
        ctx.fillStyle = sg;
        ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI*2); ctx.fill();
      }

      /* ── NODES ── soma: only visually prominent when firing ── */
      for(const n of nodes){
        /* slow drift, bounce off margins */
        n.x += n.vx; n.y += n.vy;
        if(n.x < 20){ n.x=20; n.vx*=-1; }
        if(n.x > W-20){ n.x=W-20; n.vx*=-1; }
        if(n.y < 20){ n.y=20; n.vy*=-1; }
        if(n.y > H-20){ n.y=H-20; n.vy*=-1; }
        n.vx += (Math.random()-0.5)*0.002;
        n.vy += (Math.random()-0.5)*0.002;
        const spd = Math.sqrt(n.vx*n.vx+n.vy*n.vy);
        if(spd > 0.10){ n.vx *= 0.10/spd; n.vy *= 0.10/spd; }

        /* refractory countdown */
        if(n.refract > 0){ n.refract--; }

        /* synaptic delay fire */
        if(n.pendingFire > 0){
          n.pendingFire--;
          if(n.pendingFire === 0) fireNode(n.idx);
        }

        /* autonomous charge build-up */
        if(n.refract <= 0){
          n.charge += n.chargeSpeed;
          if(n.charge >= 1){ n.charge = 0; fireNode(n.idx); }
        }

        n.glow *= 0.93; /* decay */

        const firing = n.glow > 0.05;
        const radius  = n.r * (firing ? 1 + n.glow * 1.8 : 1);

        if(firing){
          /* outer halo — very soft, contained */
          const halo = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, radius*5);
          halo.addColorStop(0, `${p.nodeHalo}${n.glow * 0.30})`);
          halo.addColorStop(1, `${p.nodeHalo}0)`);
          ctx.fillStyle = halo;
          ctx.beginPath(); ctx.arc(n.x, n.y, radius*5, 0, Math.PI*2); ctx.fill();

          /* bright soma core */
          ctx.beginPath(); ctx.arc(n.x, n.y, radius, 0, Math.PI*2);
          ctx.fillStyle = `${p.nodeFire}${Math.min(1, n.glow + 0.5)})`;
          ctx.fill();
        } else {
          /* resting soma — tiny, faint dot */
          ctx.beginPath(); ctx.arc(n.x, n.y, n.r * 0.7, 0, Math.PI*2);
          ctx.fillStyle = `${p.nodeRest}0.18)`;
          ctx.fill();
        }
      }

      /* ── Spontaneous pacemaker fire every ~2 s ── */
      frame++;
      if(frame % 130 === 0){
        const eligible = nodes.filter(n => n.refract <= 0 && !n.pendingFire);
        if(eligible.length){
          fireNode(eligible[Math.floor(Math.random()*eligible.length)].idx);
        }
      }
    }

    function loop(){ draw(); requestAnimationFrame(loop); }
    loop();
  })();
  </script>
